status-website:
  cname: status.increazy.com
  # cores do painel (dashboard.increazy.com): preto #091E28, fundo cinza #F4F5F7, fonte Archivo
  theme: light
  logoUrl: https://storage-dash.increazy.com/folders/161/19885/Logo%20do%20site/logo.svg
  favicon: https://increazy.com/favicon.ico
  hideNavTitle: true
  customHeadHtml: <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  css: >-
    :root{--body-background-color:#F4F5F7;--body-text-color:#091E28;--card-background-color:#FFFFFF;
    --nav-background-color:#FFFFFF;--nav-border-bottom-color:#E4E7EB;--nav-current-border-bottom-color:#091E28;
    --card-border-color:#E4E7EB;--submit-button-background-color:#091E28;--submit-button-border-color:#091E28;
    --error-button-background-color:#091E28;--error-button-border-color:#091E28;
    --graph-filter:grayscale(1) brightness(0.1);--graph-opacity:0.12}
    body,button,input{font-family:'Archivo',sans-serif}
    a,nav a,article a{color:#091E28!important}
    .logo img{height:1.75rem!important}
    .live-status article.graph{background-image:none!important}
    .inc-bars{display:flex;gap:2px;margin-top:.75rem;height:2rem}
    .inc-bars span{flex:1;border-radius:2px;background:#2FB344}
    .inc-bars span.w{background:#F2C94C}.inc-bars span.d{background:#E5484D}.inc-bars span.n{background:#E4E7EB}
    .inc-bars-legend{display:flex;justify-content:space-between;font-size:.8rem;opacity:.6;margin-top:.25rem}
    #inc-gateways{margin-top:3rem}
    #inc-gateways ul{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;padding:0}
    #inc-gateways a{display:inline-block;padding:.4rem .8rem;border:1px solid #E4E7EB;border-radius:.4rem;background:#fff;text-decoration:none}
  # barras de 90 dias (como statuspage.io) a partir de dailyMinutesDown do summary.json + atalhos para o status dos
  # gateways do api_payment. O Upptime renderiza no cliente e re-renderiza ao navegar, por isso o MutationObserver.
  # shortcut: depende do HTML do Upptime (.live-status article); se uma atualização do template mudar, as barras somem
  js: |-
    (function () {
      var DAYS = 90, SINCE = '2026-10-22';
      var GATEWAYS = [
        ['Mercado Pago', 'https://status.mercadopago.com'], ['Pagar.me', 'https://status.pagar.me'],
        ['PagBank (PagSeguro)', 'https://status.pagbank.com.br'], ['Cielo', 'https://status.cielo.com.br'],
        ['Efí', 'https://status.sejaefi.com.br'], ['Stripe', 'https://status.stripe.com'],
        ['PayPal', 'https://www.paypal-status.com'], ['Vindi (Yapay)', 'https://status.vindi.com.br'],
        ['Zoop', 'https://status.zoop.com.br'], ['Appmax', 'https://status.appmax.com.br'],
        ['Pagaleve', 'https://status.pagaleve.com.br']
      ];
      var sites = null;
      fetch('https://raw.githubusercontent.com/increazy/status/master/history/summary.json')
        .then(function (r) { return r.json(); }).then(function (d) { sites = d; render(); });

      function bars(site) {
        var el = document.createElement('div'), html = '';
        for (var i = DAYS - 1; i >= 0; i--) {
          var day = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
          var min = (site.dailyMinutesDown || {})[day] || 0;
          var cls = day < SINCE ? 'n' : min === 0 ? '' : min < 30 ? 'w' : 'd';
          var label = day.split('-').reverse().join('/') + ': ' +
            (day < SINCE ? 'sem dados' : min === 0 ? 'sem quedas' : min + ' min fora do ar');
          html += '<span class="' + cls + '" title="' + label + '"></span>';
        }
        el.className = 'inc-bars';
        el.innerHTML = html;
        return el;
      }

      function render() {
        var list = document.querySelector('.live-status');
        var old = document.getElementById('inc-gateways');
        if (!list && old) old.remove(); // saiu da home: o Svelte não remove o que ele não criou
        if (!list || !sites) return;
        list.querySelectorAll('article').forEach(function (art) {
          if (art.querySelector('.inc-bars')) return;
          var a = art.querySelector('h4 a'), slug = a && a.getAttribute('href').split('/').pop();
          var site = sites.filter(function (s) { return s.slug === slug; })[0];
          if (!site) return;
          art.appendChild(bars(site));
          var legend = document.createElement('div');
          legend.className = 'inc-bars-legend';
          legend.innerHTML = '<span>' + DAYS + ' dias atrás</span><span>Hoje</span>';
          art.appendChild(legend);
        });
        if (!document.getElementById('inc-gateways')) {
          var sec = document.createElement('section');
          sec.id = 'inc-gateways';
          sec.innerHTML = '<h2>Status dos meios de pagamento</h2><ul>' +
            GATEWAYS.map(function (g) { return '<li><a href="' + g[1] + '" target="_blank" rel="noopener">' + g[0] + '</a></li>'; }).join('') + '</ul>';
          list.parentNode.insertBefore(sec, list.nextSibling);
        }
      }

      new MutationObserver(render).observe(document.documentElement, { childList: true, subtree: true });
    })();
  name: Status Increazy
  navbar:
    - title: Status
      href: /

