  incidentViewOnGitHub: Ver e acompanhar no GitHub
  incidentCommentSummary: Publicado em $DATE por $AUTHOR
  incidentBack: ← Voltar para todos os incidentes
  pastIncidents: Incidentes anteriores
  pastIncidentsResolved: Resolvido em $MINUTES minutos com $POSTS atualizações
  liveStatus: Status ao vivo
  overallUptime: "Disponibilidade: $UPTIME"
  overallUptimeTitle: Disponibilidade
  averageResponseTime: "Tempo médio de resposta: $TIMEms"
  averageResponseTimeTitle: Tempo médio de resposta
  sevelDayResponseTime: Tempo de resposta em 7 dias
  responseTimeMs: Tempo de resposta (ms)
  up: No ar
  down: Fora do ar
  degraded: Lento
  loading: Carregando
  footer: Página de status da Increazy, feita com [Upptime](https://upptime.js.org)
  errorTitle: Ocorreu um erro
