  # APIs: /health/ready responde 200 só com PHP e banco no ar (503 se o banco cair)
  # increazy.com/healthz: página em branco que passa pela renderização inteira do front_pwa
  - name: Lojas
    url: https://increazy.com/healthz
  - name: Checkout plug & play
    url: https://checkout.app.increazy.com/increazy-ux/
  - name: API da plataforma
    url: https://ecommerce.api.increazy.com/health/ready
  - name: API de pagamentos
    url: https://payment.api.increazy.com/health/ready
  - name: API de sincronização
    url: https://indexer.api.increazy.com/health/ready
  - name: API do checkout
    url: https://checkout.api.increazy.com/health/ready
  - name: API de conexões
    url: https://connect.api.increazy.com/health/ready
  - name: API do painel
    url: https://dash.api.increazy.com/health/ready
  - name: API de métricas
    url: https://analytics.api.increazy.com/health/ready
  - name: API de scraper
    url: https://webscraper.increazy.com/healthz
  - name: Minha conta plug & play
    url: https://account.app.increazy.com
  - name: Painel
    url: https://dashboard.increazy.com
  - name: Scripts
    url: https://storage.increazy.com/scripts/checkout.js
  - name: Documentação
    url: https://docs.increazy.com

status-website:
  cname: status.increazy.com
  # cores e fonte do increazy.com: azul-marinho #091E28, azul #0058A4, fundo #DCE6F0, Archivo
  theme: light
  logoUrl: https://storage-dash.increazy.com/folders/161/19885/Logo%20do%20site/logo.svg
  favicon: https://increazy.com/favicon.ico
  hideNavTitle: true
  customHeadHtml: <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  css: >-
    :root{--body-background-color:#DCE6F0;--body-text-color:#091E28;--card-background-color:#FFFFFF;
    --nav-background-color:#FFFFFF;--nav-border-bottom-color:#C3D5E2;--nav-current-border-bottom-color:#0058A4;
    --card-border-color:#C3D5E2;--submit-button-background-color:#091E28;--submit-button-border-color:#091E28;
    --error-button-background-color:#091E28;--error-button-border-color:#091E28}
    body,button,input{font-family:'Archivo',sans-serif}
    a{color:#0058A4}
  name: Status Increazy
  introTitle: "Status dos serviços Increazy"
  introMessage: "Testado a cada 5 minutos, de fora da nossa infraestrutura."
  navbar:
    - title: Status
      href: /
    - title: Increazy
      href: https://increazy.com

# textos da página em português (padrão do Upptime é inglês)
i18n:
  locale: pt-BR
  activeIncidents: Incidentes ativos
  allSystemsOperational: Todos os sistemas operando normalmente
  incidentReport: "Relatório do incidente #$NUMBER →"
